name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '6.4.*', dependencies: 'lowest' }
          - { php: '8.2', symfony: '6.4.*', dependencies: 'highest' }
          - { php: '8.2', symfony: '7.*', dependencies: 'highest' }
          - { php: '8.4', symfony: '7.*', dependencies: 'highest' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - uses: ramsey/composer-install@v3
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit
